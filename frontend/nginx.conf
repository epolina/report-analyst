# Full config (not a conf.d snippet) so nginx runs as the unprivileged `nginx` user:
# pid and temp files live in /tmp. ${BACKEND_HOSTNAME} is filled in by envsubst at start.
pid /tmp/nginx.pid;

events {}

http {
  include /etc/nginx/mime.types;
  access_log off;  # uvicorn logs the API requests; static files and polling would only add noise
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    client_max_body_size 100m;  # MAX_UPLOAD_MB

    # /api/uploads → backend:8000/uploads
    location /api/ {
      proxy_pass http://${BACKEND_HOSTNAME}/;
    }

    location / {
      try_files $uri /index.html;
      add_header Cache-Control "no-cache";  # revalidate, so a rebuild (or another app on :8080) never shows a stale page
    }
  }
}
